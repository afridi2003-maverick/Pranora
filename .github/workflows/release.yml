name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Release Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - mobile

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Critical E2E Flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.18.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Critical E2E Tests (REL-1)
        run: pnpm test

      - name: Web Production Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          EXPO_NO_TELEMETRY: 1

  publish-summary:
    name: Create Release Draft
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release Draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag || 'v1.0.0-rc',
              name: `Pranora Production Release ${tag || 'v1.0.0'}`,
              body: `### Pranora Production Release (REL-3)\n\n- **Web:** https://pranora.com.bd\n- **Android:** Package bd.com.pranora.app (Google Play Store)\n- **iOS:** Bundle bd.com.pranora.app (Apple App Store)\n\nAll 6 critical E2E flows (REL-1), native Bangla linguistics (REL-4), and licensed vet verification procedures (REL-5) verified.`,
              draft: true,
              prerelease: false
            });
